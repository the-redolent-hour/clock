<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pretend.org pomodoro</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #173977;
      color: #f7f4ed;
      font-family: "DM Sans", sans-serif;
      overflow: hidden;
    }

    .pomodoro {
      width: min(620px, 100%);
      min-height: 350px;
      padding: 30px 28px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.05), transparent 20%),
        radial-gradient(circle at 85% 80%, rgba(255,255,255,.04), transparent 20%),
        #173977;
    }

    /* little stars */
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .8;
    }

    .star {
      position: absolute;
      color: #d9e5ff;
      font-size: 11px;
      animation: twinkle 3s ease-in-out infinite;
    }

    .star:nth-child(1) { top: 14%; left: 15%; }
    .star:nth-child(2) { top: 22%; left: 27%; animation-delay: .5s; }
    .star:nth-child(3) { top: 16%; right: 18%; animation-delay: 1s; }
    .star:nth-child(4) { bottom: 18%; left: 20%; animation-delay: 1.5s; }
    .star:nth-child(5) { bottom: 14%; right: 24%; animation-delay: 2s; }
    .star:nth-child(6) { top: 42%; right: 9%; animation-delay: .8s; }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .mode-picker {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .mode-btn {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.64);
      padding: 8px 13px;
      border-radius: 999px;
      font: inherit;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s ease;
    }

    .mode-btn:hover {
      background: rgba(255,255,255,.08);
    }

    .mode-btn.active {
      background: #f2f2ee;
      color: #173977;
      border-color: #f2f2ee;
    }

    .timer-wrap {
      width: 210px;
      height: 210px;
      margin: 15px auto 4px;
      position: relative;
      display: grid;
      place-items: center;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    circle {
      fill: none;
      stroke-width: 1.6;
    }

    .track {
      stroke: rgba(255,255,255,.13);
    }

    .progress {
      stroke: #dfe8fb;
      stroke-linecap: round;
      transition: stroke-dashoffset .5s linear;
    }

    .timer-content {
      position: relative;
      z-index: 2;
    }

    .tiny-star {
      font-size: 16px;
      margin-bottom: -5px;
      opacity: .85;
    }

    .time {
      font-family: "Playfair Display", serif;
      font-size: 58px;
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 500;
    }

    .status {
      margin-top: 8px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      color: rgba(255,255,255,.58);
      font-size: 14px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 6px;
      position: relative;
      z-index: 2;
    }

    .main-btn,
    .small-btn {
      border: none;
      cursor: pointer;
      transition: .2s ease;
      font-family: "DM Sans", sans-serif;
    }

    .main-btn {
      min-width: 112px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #f3f2ed;
      color: #173977;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 11px;
      font-weight: 500;
    }

    .main-btn:hover {
      transform: translateY(-1px);
      background: white;
    }

    .small-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 15px;
    }

    .small-btn:hover {
      background: rgba(255,255,255,.11);
    }

    .footer {
      margin-top: 15px;
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: rgba(255,255,255,.43);
    }

    .footer i {
      font-family: "Playfair Display", serif;
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      .pomodoro {
        padding-inline: 16px;
      }

      .timer-wrap {
        width: 190px;
        height: 190px;
      }

      .time {
        font-size: 52px;
      }

      .mode-btn {
        font-size: 9px;
        padding: 7px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
      }

      .progress {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="pomodoro">

    <div class="stars" aria-hidden="true">
      <span class="star">✦</span>
      <span class="star">⋆</span>
      <span class="star">✧</span>
      <span class="star">⋆</span>
      <span class="star">✦</span>
      <span class="star">·</span>
    </div>

    <div class="mode-picker">
      <button class="mode-btn active" data-mode="focus">focus</button>
      <button class="mode-btn" data-mode="short">little break</button>
      <button class="mode-btn" data-mode="long">long break</button>
    </div>

    <div class="timer-wrap">

      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle
          class="track"
          cx="60"
          cy="60"
          r="53"
        />

        <circle
          class="progress"
          cx="60"
          cy="60"
          r="53"
        />
      </svg>

      <div class="timer-content">
        <div class="tiny-star">✦</div>
        <div class="time" id="time">25:00</div>
        <div class="status" id="status">pretend to be productive</div>
      </div>

    </div>

    <div class="controls">
      <button
        class="small-btn"
        id="reset"
        aria-label="Reset timer"
        title="Reset"
      >
        ↺
      </button>

      <button class="main-btn" id="startPause">
        start
      </button>

      <button
        class="small-btn"
        id="skip"
        aria-label="Skip session"
        title="Skip"
      >
        →
      </button>
    </div>

    <div class="footer">
      <span id="sessions">0 focus sessions</span>
      &nbsp; · &nbsp;
      <i>pretend.org</i>
    </div>

  </main>

  <script>
    const MODES = {
      focus: {
        seconds: 25 * 60,
        label: "pretend to be productive"
      },

      short: {
        seconds: 5 * 60,
        label: "go stare at the ceiling"
      },

      long: {
        seconds: 15 * 60,
        label: "you have earned a disappearance"
      }
    };

    const timeDisplay = document.getElementById("time");
    const statusDisplay = document.getElementById("status");
    const startPauseBtn = document.getElementById("startPause");
    const resetBtn = document.getElementById("reset");
    const skipBtn = document.getElementById("skip");
    const sessionsDisplay = document.getElementById("sessions");

    const modeButtons = document.querySelectorAll(".mode-btn");

    const progressCircle = document.querySelector(".progress");

    const radius = 53;
    const circumference = 2 * Math.PI * radius;

    progressCircle.style.strokeDasharray = circumference;

    let currentMode = "focus";
    let totalSeconds = MODES[currentMode].seconds;
    let secondsLeft = totalSeconds;

    let timer = null;
    let running = false;

    let focusSessions = 0;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;

      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(secondsLeft);

      const progress =
        1 - (secondsLeft / totalSeconds);

      progressCircle.style.strokeDashoffset =
        circumference * (1 - progress);

      document.title =
        `${formatTime(secondsLeft)} · pretend.org`;
    }

    function setMode(mode) {
      stopTimer();

      currentMode = mode;
      totalSeconds = MODES[mode].seconds;
      secondsLeft = totalSeconds;

      statusDisplay.textContent = MODES[mode].label;

      modeButtons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.mode === mode
        );
      });

      updateDisplay();
    }

    function startTimer() {
      if (running) return;

      running = true;
      startPauseBtn.textContent = "pause";

      timer = setInterval(() => {
        secondsLeft--;

        if (secondsLeft <= 0) {
          secondsLeft = 0;
          updateDisplay();
          completeSession();
          return;
        }

        updateDisplay();

      }, 1000);
    }

    function stopTimer() {
      running = false;
      startPauseBtn.textContent = "start";

      clearInterval(timer);
      timer = null;
    }

    function toggleTimer() {
      if (running) {
        stopTimer();
      } else {
        startTimer();
      }
    }

    function resetTimer() {
      stopTimer();

      secondsLeft = MODES[currentMode].seconds;
      totalSeconds = secondsLeft;

      updateDisplay();
    }

    function completeSession() {
      stopTimer();

      if (currentMode === "focus") {
        focusSessions++;

        sessionsDisplay.textContent =
          `${focusSessions} focus session${focusSessions === 1 ? "" : "s"}`;

        if (focusSessions % 4 === 0) {
          setMode("long");
        } else {
          setMode("short");
        }

      } else {
        setMode("focus");
      }

      chime();
    }

    function skipSession() {
      completeSession();
    }

    function chime() {
      try {
        const audioContext =
          new (window.AudioContext || window.webkitAudioContext)();

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 660;

        gain.gain.setValueAtTime(
          0.08,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.8
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.8);

      } catch (error) {
        // Timer still works if audio is unavailable.
      }
    }

    startPauseBtn.addEventListener(
      "click",
      toggleTimer
    );

    resetBtn.addEventListener(
      "click",
      resetTimer
    );

    skipBtn.addEventListener(
      "click",
      skipSession
    );

    modeButtons.forEach(button => {
      button.addEventListener("click", () => {
        setMode(button.dataset.mode);
      });
    });

    updateDisplay();
  </script>

</body>
</html>
