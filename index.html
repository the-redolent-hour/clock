<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>pretend.org clock</title>

  <!-- Cute fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #071b4d;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: white;
    }

    .clock-card {
      width: 100%;
      height: 180px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    .sparkles {
      font-family: "DM Serif Display", serif;

      font-size: 18px;
      letter-spacing: 8px;

      color: #a9bdff;

      margin-bottom: 4px;

      opacity: 0.9;
    }

    .time-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;

      gap: 8px;
    }

    #time {
      font-family: "DM Serif Display", serif;

      font-size: clamp(58px, 11vw, 95px);

      line-height: 0.95;

      letter-spacing: 1px;

      color: #ffffff;
    }

    #ampm {
      font-family: "Manrope", sans-serif;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 2px;

      color: #9bb7ff;

      margin-top: 12px;
    }

    #date {
      font-family: "Manrope", sans-serif;

      margin-top: 10px;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #b8c7ef;
    }

    .tiny-line {
      width: 55px;
      height: 1px;

      margin-top: 12px;

      background: #547ac8;

      opacity: 0.75;
    }

    .label {
      font-family: "DM Serif Display", serif;

      font-style: italic;

      margin-top: 7px;

      font-size: 12px;

      letter-spacing: 0.5px;

      color: #879fd8;
    }
  </style>
</head>

<body>

  <div class="clock-card">

    <div class="sparkles">
      ⋆ ✦ ⋆
    </div>

    <div class="time-row">
      <div id="time">12:00</div>
      <div id="ampm">AM</div>
    </div>

    <div id="date">
      FRIDAY · SEPTEMBER 4
    </div>

    <div class="tiny-line"></div>

    <div class="label">
      pretend.org
    </div>

  </div>


  <script>
    function updateClock() {

      const now = new Date();

      let hours = now.getHours();
      const minutes = now.getMinutes();

      const ampm = hours >= 12 ? "PM" : "AM";

      hours = hours % 12;
      hours = hours || 12;

      const formattedMinutes =
        minutes.toString().padStart(2, "0");

      document.getElementById("time").textContent =
        `${hours}:${formattedMinutes}`;

      document.getElementById("ampm").textContent =
        ampm;


      const dateOptions = {
        weekday: "long",
        month: "long",
        day: "numeric"
      };

      const formattedDate =
        now.toLocaleDateString("en-US", dateOptions);

      document.getElementById("date").textContent =
        formattedDate;
    }


    updateClock();

    setInterval(updateClock, 1000);
  </script>

</body>
</html>
