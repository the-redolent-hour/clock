<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- pretty fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: #0b2868;
        color: #f8f7f4;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    .clock {
        width: 100%;
        text-align: center;
        padding: 24px 20px;
    }

    .stars {
        color: #b6c9ff;
        font-size: 18px;
        letter-spacing: 22px;
        margin-bottom: -4px;
        padding-left: 22px;
    }

    .time-row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 10px;
    }

    #time {
        font-family: "Bodoni Moda", serif;
        font-size: clamp(64px, 13vw, 108px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -6px;
    }

    #ampm {
        font-family: "Montserrat", sans-serif;
        font-weight: 300;
        font-size: 15px;
        letter-spacing: 4px;

        margin-top: 18px;
    }

    #date {
        font-family: "Montserrat", sans-serif;
        font-weight: 300;

        font-size: clamp(11px, 2vw, 15px);
        letter-spacing: 4px;
        text-transform: uppercase;

        margin-top: 12px;
    }

    .pretend {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;

        color: #bac7e9;
        font-size: 20px;

        margin-top: 11px;
    }
</style>
</head>

<body>

<div class="clock">

    <div class="stars">⋆ ✦ ⋆</div>

    <div class="time-row">
        <div id="time">2:31</div>
        <div id="ampm">AM</div>
    </div>

    <div id="date">FRIDAY, SEPTEMBER 4</div>

    <div class="pretend">pretend.org</div>

</div>

<script>
function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes();

    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours || 12;

    const formattedMinutes =
        minutes.toString().padStart(2, "0");

    document.getElementById("time").textContent =
        `${hours}:${formattedMinutes}`;

    document.getElementById("ampm").textContent = ampm;

    const date = now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
    });

    document.getElementById("date").textContent =
        date.toUpperCase();
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
